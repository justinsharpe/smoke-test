# Smoke-test's selftest.d deliberately contains 2 unfixable failures + 1 skip to
# prove the harness contract (exit code == unfixed failures, skip != fail, timeout
# bounding). CI therefore asserts exit code 2 — a 0 here would mean the contract broke.
# The `|| rc=$?` form keeps bash -e from aborting on the harness's intentional non-zero.
name: CI
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          rc=0
          python3 smoke_test.py --dir selftest.d || rc=$?
          if [ "$rc" -eq 2 ]; then echo "contract OK: exit=2 as designed"; else echo "contract BROKEN: expected exit 2, got $rc"; exit 1; fi
